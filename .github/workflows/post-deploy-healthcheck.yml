name: Post-deploy health-check

# After a push to main — which the Dokploy apps (respovia-api / respovia-web)
# are rebuilt from — poll production until it is healthy, so a hard-down
# container or a DB / connectivity failure surfaces HERE in Actions instead of
# via a user report. Production is the company server behind the Cloudflare
# Tunnel (PROD_SETUP.md §3), with the dedicated Dokploy Postgres behind the
# API; the legacy Vercel projects only serve staging/PR previews.
#
# LIMITATION: the health endpoints carry no git-SHA marker, so this verifies
# the API is UP and its database is REACHABLE after the push — NOT that this
# exact commit is live (a Dokploy rebuild may land later; the check still
# gates that prod didn't regress). Migrations run at API-container boot: a bad
# migration aborts the new container before it serves, the previous deployment
# keeps running, and readiness stays green — so this check cannot catch a
# migration that failed to apply, only one that broke readiness.
#
# ROLLBACK is manual: redeploy the previous build of the affected app in the
# Dokploy panel (paas.weez.boo, LAN/VPN). See PROD_SETUP.md → Rollback.

on:
  push:
    branches: [main]
  workflow_dispatch:

# Newest push supersedes an in-flight check (we only care about the latest deploy).
concurrency:
  group: post-deploy-healthcheck
  cancel-in-progress: true

permissions:
  contents: read

env:
  # Production hosts on respovia.com (registered 2026-08-10; see PROD_SETUP.md).
  API_BASE: https://api.respovia.com
  SPA_BASE: https://app.respovia.com
  INITIAL_DELAY_SECONDS: "30"
  MAX_ATTEMPTS: "16"
  SLEEP_SECONDS: "15"

jobs:
  healthcheck:
    name: poll live deployment
    runs-on: ubuntu-latest
    # Worst case (both probes time out every attempt): 30 + 16×(10+10+15) ≈ 9.8 min,
    # comfortably under 15 — so a hard-down deploy fails via the clean ::error::
    # + rollback message below, not via a timeout kill.
    timeout-minutes: 15
    steps:
      - name: Wait for the API + SPA to be healthy
        run: |
          set -u
          # DNS/TLS sanity check. curl exit 6 = DNS not resolving,
          # 35/51/53/54/58/60 = TLS not valid. The hosts are PROXIED Cloudflare
          # records, so DNS/TLS terminate at the Cloudflare edge and these
          # errors mean the Cloudflare records themselves are broken (deleted
          # zone, un-proxied host with no origin cert) — never a bad deploy,
          # and a rollback would fix nothing. (A DOWN TUNNEL does not trip
          # this: the edge still answers and returns HTTP 530 — handled in the
          # probe loop below.) Retry a few times so one transient runner
          # hiccup doesn't hard-fail the run.
          for base in "$API_BASE" "$SPA_BASE"; do
            tries=0
            while :; do
              rc=0
              curl -sS -m 10 -o /dev/null "$base" || rc=$?
              case "$rc" in
                6|35|51|53|54|58|60)
                  tries=$((tries + 1))
                  if [ "$tries" -ge 3 ]; then
                    echo "::error::${base} unreachable (curl exit ${rc}: DNS/TLS, ${tries} attempts) — the Cloudflare DNS records for respovia.com are broken; check the zone + the proxied CNAMEs to the tunnel. Not a bad deploy: do NOT roll back."
                    exit 1
                  fi
                  echo "::warning::${base} DNS/TLS error (curl exit ${rc}), attempt ${tries}/3 — retrying in 10s…"
                  sleep 10
                  ;;
                *) break ;;
              esac
            done
          done
          echo "Giving the deploy ${INITIAL_DELAY_SECONDS}s to land before probing…"
          sleep "$INITIAL_DELAY_SECONDS"

          attempt=1
          edge_err=""
          while [ "$attempt" -le "$MAX_ATTEMPTS" ]; do
            echo "── attempt ${attempt}/${MAX_ATTEMPTS} ──"
            ok=1

            # Liveness: GET /api/v1/health -> 200 {"ok":true,...}
            live=$(curl -sS -m 10 -w '\n%{http_code}' "$API_BASE/api/v1/health" || true)
            live_code=$(printf '%s' "$live" | tail -n1)
            live_body=$(printf '%s' "$live" | sed '$d')
            if [ "$live_code" = "200" ] && printf '%s' "$live_body" | grep -q '"ok":true'; then
              echo "  liveness  OK   ($API_BASE/api/v1/health)"
            else
              echo "  liveness  WAIT (http ${live_code}: ${live_body})"; ok=0
            fi

            # Readiness: GET /api/v1/health/ready -> 200 {"ok":true,...} (DB reachable)
            ready=$(curl -sS -m 10 -w '\n%{http_code}' "$API_BASE/api/v1/health/ready" || true)
            ready_code=$(printf '%s' "$ready" | tail -n1)
            ready_body=$(printf '%s' "$ready" | sed '$d')
            if [ "$ready_code" = "200" ] && printf '%s' "$ready_body" | grep -q '"ok":true'; then
              echo "  readiness OK   ($API_BASE/api/v1/health/ready)"
            else
              echo "  readiness WAIT (http ${ready_code}: ${ready_body})"; ok=0
            fi

            # Cloudflare edge errors 520-526/530 mean the edge answered but
            # could NOT reach the origin — i.e. the 'respovia' tunnel /
            # cloudflared / container path is down. That is an ingress outage,
            # not a bad build, so remember it to steer the final error message
            # away from a pointless rollback.
            for code in "$live_code" "$ready_code"; do
              case "$code" in
                52[0-6]|530) edge_err="$code" ;;
              esac
            done

            if [ "$ok" = "1" ]; then
              # SPA root — soft check: nginx behind the tunnel should always 200,
              # but the API is the hard gate; warn on a non-200, don't fail the job.
              spa_code=$(curl -sS -m 10 -o /dev/null -w '%{http_code}' "$SPA_BASE" || true)
              if [ "$spa_code" = "200" ]; then
                echo "  spa root  OK   ($SPA_BASE)"
              else
                echo "::warning::SPA root returned http ${spa_code} (soft check — not failing the job)"
              fi
              echo "✅ deployment healthy after ${attempt} attempt(s)."
              exit 0
            fi

            attempt=$((attempt + 1))
            sleep "$SLEEP_SECONDS"
          done

          if [ -n "$edge_err" ]; then
            echo "::error::Cloudflare edge error ${edge_err} while probing — the edge cannot reach the origin. This is an INGRESS outage (the 'respovia' Cloudflare Tunnel / the cloudflared Dokploy app / the container network), not a bad build: fix the tunnel, do NOT roll back."
            echo "API: ${API_BASE}  SPA: ${SPA_BASE}"
            exit 1
          fi
          echo "::error::Deployment did not become healthy within ~$((MAX_ATTEMPTS * SLEEP_SECONDS))s of probing."
          echo "API: ${API_BASE}  SPA: ${SPA_BASE}"
          echo "Rollback: redeploy the previous build of the affected app in the Dokploy panel (paas.weez.boo, LAN/VPN). See PROD_SETUP.md → Rollback."
          exit 1
