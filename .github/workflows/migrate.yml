name: Migrate (legacy — prod runs migrations at boot)

# LEGACY / manual-only. Production moved to a dedicated Postgres inside
# Dokploy on the company server, which GitHub-hosted runners CANNOT reach
# (LAN-only, behind a Cloudflare Tunnel that only exposes HTTP). Prod
# migrations now run at API-container boot on Dokploy: api/Dockerfile's CMD
# executes api/scripts/migrate.ts (advisory-locked, idempotent) before
# starting the server, so schema and code deploy as one unit.
#
# This workflow is kept ONLY for the edge case of migrating a reachable
# database via the `production` environment secret (e.g. the retired Neon
# instance during the rollback-soak window). Running it against the Dokploy
# DB will fail with a connection timeout — that is expected.
#
# Staging still migrates via CI (migrate-staging.yml — staging remains on Neon).

on:
  # Manual runs only — the push-to-main trigger was removed with the Dokploy
  # DB cutover (a push-triggered run could never reach the prod DB again).
  workflow_dispatch:

# Never run two migration passes at once, and never cancel one mid-flight.
concurrency:
  group: migrate-neon-prod
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  migrate:
    name: apply pending migrations
    runs-on: ubuntu-latest
    # Gate the prod DB secret behind a GitHub Environment. DATABASE_URL is an
    # environment secret on `production`, which is restricted to the `main`
    # branch — so a workflow_dispatch from any other branch cannot read it.
    # No required-reviewer rule, so pushes to main still migrate automatically.
    environment: production
    steps:
      - uses: actions/checkout@v4
        # Full repo checkout (default) so db/migrations/ at the repo root is
        # present — the runner reads ../../db/migrations from api/scripts/.

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.3.13" # match .github/workflows/ci.yml

      - name: Install API deps
        working-directory: api
        run: bun install --frozen-lockfile

      - name: Apply migrations to prod Neon
        working-directory: api
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: bun run migrate
