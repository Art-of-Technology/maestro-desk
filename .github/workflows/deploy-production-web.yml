name: Deploy production web

on:
  push:
    branches: [main]
    paths:
      - 'web/**'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deploy-production-web
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Trigger Dokploy
        env:
          DOKPLOY_WEB_DEPLOY_URL: ${{ secrets.DOKPLOY_WEB_DEPLOY_URL }}
          EVENT_NAME: ${{ github.event_name }}
          REF: ${{ github.ref }}
          REPOSITORY: ${{ github.repository }}
          SHA: ${{ github.sha }}
        run: |
          set -eu
          if [ -z "$DOKPLOY_WEB_DEPLOY_URL" ]; then
            echo "::error::DOKPLOY_WEB_DEPLOY_URL is not set."
            exit 1
          fi

          payload="$GITHUB_EVENT_PATH"
          if [ "$EVENT_NAME" = "workflow_dispatch" ]; then
            payload="$(mktemp)"
            jq -n \
              --arg ref "$REF" \
              --arg repository "$REPOSITORY" \
              --arg sha "$SHA" \
              '{ref: $ref, repository: {full_name: $repository}, head_commit: {id: $sha, message: "Manual production web deploy"}, commits: [{id: $sha, message: "Manual production web deploy", added: [], removed: [], modified: ["web/index.html"]}]}' \
              > "$payload"
          fi

          code="$(curl -sS --max-time 30 -o /dev/null -w '%{http_code}' \
            -X POST \
            -H 'Content-Type: application/json' \
            -H 'X-GitHub-Event: push' \
            --data-binary "@$payload" \
            "$DOKPLOY_WEB_DEPLOY_URL")"

          if [ "$code" != "200" ]; then
            echo "::error::Dokploy rejected the deployment trigger with HTTP $code."
            exit 1
          fi
          echo "Dokploy accepted the production web deployment."
