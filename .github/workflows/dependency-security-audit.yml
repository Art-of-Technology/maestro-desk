name: Dependency security audit

on:
  schedule:
    - cron: '15 6 * * *'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: dependency-security-audit
  cancel-in-progress: true

jobs:
  audit:
    name: Audit current main dependencies
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: api
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          persist-credentials: false

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: '1.3.13'

      - name: Install locked dependencies without lifecycle scripts
        run: bun install --frozen-lockfile --ignore-scripts

      - name: Check for moderate or higher vulnerabilities
        id: audit
        run: bun ../scripts/dependency-audit-result.mjs

      - name: Dependency audit found vulnerabilities
        if: steps.audit.outputs.outcome == 'findings'
        run: exit 1

      - name: Dependency audit could not complete
        if: "!cancelled() && (steps.audit.outputs.outcome == 'error' || (failure() && steps.audit.outputs.outcome != 'findings'))"
        run: exit 1
