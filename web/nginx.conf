# Respovia SPA/portal — nginx server config for the self-hosted (Dokploy)
# image. TLS terminates at Traefik in front of this container; nginx serves
# plain HTTP on :80 inside the overlay network.
#
# The security headers below are a 1:1 copy of web/vercel.json (the Vercel
# hosting config) — if you change one, change both while the Vercel host still
# exists. `always` keeps them on error responses (404 etc.) too. No location
# block may use add_header: nginx replaces ALL inherited add_header directives
# the moment a location adds its own, which would silently strip the CSP.

# Apex/www → app. redirect (PROD_SETUP.md: REQUIRED — the API's CORS/trusted-
# origin allowlist is app.respovia.com alone, so a SPA rendered on the apex
# renders but can't sign in, with opaque CORS errors. Redirect instead; never
# "fix" that by widening the server allowlist). 308 preserves method+path.
# Reaches us via the same Cloudflare Tunnel ingress as app.respovia.com.
server {
    listen 80;
    server_name respovia.com www.respovia.com;
    server_tokens off;
    return 308 https://app.respovia.com$request_uri;
}

# default_server is load-bearing: without it, nginx's default is the FIRST
# block in the file — the redirect above — which would 308 every hostname
# (app.respovia.com included: an infinite redirect loop). `_` never matches
# by name; this block is chosen for any host not named above.
server {
    listen 80 default_server;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Don't advertise the nginx version in Server/error pages.
    server_tokens off;

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;

    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com; img-src 'self' data: https:; connect-src 'self' https://api.respovia.com https://maestro-desk-zjkl.vercel.app https://maestro-desk-zjkl-git-staging-jodi-1420s-projects.vercel.app http://localhost:3001 https://api.anthropic.com; worker-src 'self'; frame-ancestors 'none'; base-uri 'self'; form-action 'self'; object-src 'none'" always;
    add_header Strict-Transport-Security "max-age=63072000; includeSubDomains; preload" always;
    add_header X-Frame-Options "DENY" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=()" always;

    # EVERY response must revalidate (matches what Vercel served): filenames
    # aren't content-hashed and deploys change files in place, so a browser
    # heuristically caching a JS module (RFC 9111 default when no Cache-Control
    # is sent) would pair a fresh index.html with stale modules — a mixed
    # module graph that crashes at import time. ETag/Last-Modified (nginx
    # defaults) make the forced revalidation cheap 304s.
    add_header Cache-Control "public, max-age=0, must-revalidate" always;

    location / {
        try_files $uri $uri/ =404;
    }
}
